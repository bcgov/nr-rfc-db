# Source: rfc-database-chart/templates/database-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --provider kubernetes -o temp-openshift-files/ -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: database
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: database
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --provider kubernetes -o temp-openshift-files/ -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: database
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: rfc_db_1
            - name: POSTGRES_HOST
              value: database
            - name: POSTGRES_PASSWORD
              value: default
            - name: POSTGRES_USER
              value: rfc_db_user
          image: postgis/postgis:16-3.4
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - rfc_db_user
          name: database
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: database-volume
      restartPolicy: Always
      volumes:
        - name: database-volume
          persistentVolumeClaim:
            claimName: database-volume
