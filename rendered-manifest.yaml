# Source: rfc-database-chart/templates/migrations-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --provider kubernetes -o temp-openshift-files/ -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: migrations
  name: migrations
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: migrations
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --provider kubernetes -o temp-openshift-files/ -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: migrations
    spec:
      containers:
        - args:
            - info
            - migrate
            - info
          env:
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_DEFAULT_SCHEMA
              value: users
            - name: FLYWAY_PASSWORD
              value: default
            - name: FLYWAY_URL
              value: jdbc:postgresql://database:5432/rfc_db_1
            - name: FLYWAY_USER
              value: rfc_db_user
          image: flyway/flyway:10-alpine
          name: migrations
          volumeMounts:
            - mountPath: /flyway/sql
              name: migrations-cm0
              readOnly: true
      restartPolicy: Always
      volumes:
        - configMap:
            name: migrations-cm0
          name: migrations-cm0
