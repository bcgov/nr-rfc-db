apiVersion: v1
kind: Service
metadata:
  name: {{ include "rfc-database-chart.fullname" . }}-api
  labels:
    app.kubernetes.io/name: {{ include "rfc-database-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "rfc-database-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
