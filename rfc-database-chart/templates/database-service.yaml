apiVersion: v1
kind: Service
metadata:
  name: {{ include "rfc-database-chart.fullname" . }}-database
  labels:
    app.kubernetes.io/name: {{ include "rfc-database-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.servicePort }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "rfc-database-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
