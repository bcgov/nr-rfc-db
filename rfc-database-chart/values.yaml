# Default values for rfc-database-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  image:
    repository: postgis/postgis
    tag: "16-3.4"
  database: rfc_db_1
  user: rfc_db_user
  password: default
  port: 5432
  servicePort: 5433
  persistence:
    enabled: true
    size: 500Mi
    storageClass: ""
    existingClaim: ""

api:
  image:
    repository: postgrest/postgrest
    tag: latest
  schema: asp
  anonRole: web_anon
  dbUri: postgres://authenticator:password@rfc-db-rfc-database-chart-database:5432/rfc_db_1
  #dbUri: postgres://authenticator:password@database:5432/rfc_db_1
  route:
    enabled: true
    host: "rfc-database.apps.silver.devops.gov.bc.ca"
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

migrations:
  enabled: true
  runAsJob: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  image:
    repository: flyway/flyway
    tag: 10-alpine
  user: rfc_db_user
  password: default
  #url: jdbc:postgresql://rfc-db-rfc-database-chart-database:5433/rfc_db_1
  schema: users
  baseOnMigrate: true
