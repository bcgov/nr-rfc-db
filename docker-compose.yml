# Reusable vars
x-var:
  - &POSTGRES_USER
    rfc_db_user
  - &POSTGRES_PASSWORD
    default
  - &POSTGRES_DATABASE
    rfc_db_1

# Reusable envars for postgres
x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DB: *POSTGRES_DATABASE  #fix: POSTGRES_DATABASE changed to POSTGRES_DB, the recognized keyword for postgres database build

services:
  #database service:
  #Create postgres database with name = POSTGRES_DB, user = POSTGRES_USER, and password = POSTGRES_PASSWORD
  database:
    image: postgis/postgis:16-3.4   #Do we want postgis? Not sure...
    container_name: database
    environment:
      <<: *postgres-vars
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
    ports: ["5433:5432"]
    volumes:  #Mapping data storage location to existing volume:
     - database_volume:/var/lib/postgresql/data
    
#migrations service
#Apply to the migrations specified by the sql files in the migrations/sql folder to create the structure of the database:
  migrations:
    image: flyway/flyway:10-alpine
    container_name: migrations
    command: info migrate info
    volumes: ["./migrations/sql:/flyway/sql:ro"]
    environment:
      #flyway URL updated to reflect database name instead of default database "postgres"
      FLYWAY_USER: *POSTGRES_USER
      FLYWAY_URL: jdbc:postgresql://database:5432/rfc_db_1  
      FLYWAY_PASSWORD: *POSTGRES_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: users
    depends_on:
      database:
        condition: service_healthy
  
  api:
    image: postgrest/postgrest:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      #postgrest not compatible with jdbc connection format
      #PGRST_DB_URI: jdbc:postgresql://database:5432/rfc_db_1
      PGRST_DB_URI: postgres://authenticator:password@database:5432/rfc_db_1
      PGRST_DB_SCHEMA: asp
      PGRST_DB_ANON_ROLE: web_anon
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:  #Mapping data storage location to existing volume:
  database_volume: